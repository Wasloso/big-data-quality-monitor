# Deliberate C14 runs only; production services keep their normal configuration.
services:
  spark-windows:
    cpus: ${BENCHMARK_THREADS:-2}
    mem_limit: ${BENCHMARK_SPARK_MEMORY:-2g}
  benchmark-producer:
    build:
      context: .
      dockerfile: Dockerfile.kafka
    entrypoint: ["python", "-m", "quality_monitor.benchmark_producer"]
    cpus: 1
    mem_limit: 512m
    volumes:
      - archive-data:/data
  benchmark-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["python", "-m", "quality_monitor.benchmark_observer"]
    cpus: 1
    mem_limit: 512m
    volumes:
      - type: volume
        source: archive-data
        target: /data/serving
        volume:
          subpath: ${BENCHMARK_RUN_ID:-unused}/serving
          nocopy: true
    environment:
      QUALITY_DATABASE: /data/serving/quality.sqlite
      STATIONS_DATABASE: /data/serving/stations.sqlite
      PRODUCER_STATUS_ROOT: /data/serving/producer-status
